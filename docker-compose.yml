services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments_ops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DEMO_MODE: "true"
      DATABASE_URL: postgres://payments:payments@db:5432/payments_ops
      STATIC_DIR: /app/frontend/dist/frontend/browser
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
